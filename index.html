<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kids Learning</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">   <!-- iPhone/iPad home screen icon -->
<meta name="theme-color" content="#4a90e2">
<style>
  /* One screen, no scrolling: the app buttons sit in a 2 x 2 grid sized to the screen */
  html, body { height: 100%; overflow: hidden; }
  body { font-family: sans-serif; margin: 0; background: #fffdf5; height: 100dvh;
         display: grid; grid-template-columns: repeat(2, auto); align-content: center; justify-content: center;
         gap: clamp(12px, 3vmin, 28px); user-select: none; -webkit-user-select: none; }
  /* Big picture buttons: kids pick by picture, words are for grown-ups */
  a.app { display: flex; flex-direction: column; align-items: center; justify-content: center;
          width: min(42vw, 40vh, 300px); height: min(42vw, 40vh, 300px); border-radius: 30px; text-decoration: none; color: #333;
          font-size: min(7vw, 5.5vh, 34px); font-weight: bold; box-shadow: 0 6px 0 rgba(0,0,0,0.15); }
  a.app .pic { font-size: min(20vw, 17vh, 110px); line-height: 1.1; }
  #math    { background: #ffd54f; }
  #writing { background: #a5d6f7; }
  #clock   { background: #c8e6c9; }
  #reading { background: #f8bbd0; }
  /* Version number, top right corner */
  #version { position: fixed; top: 8px; right: 12px; font-size: 16px; color: #999; }
</style>
</head>
<body>
  <div id="version"></div>
  <a class="app" id="math" href="math.html"><span class="pic">&#128290;</span>Math</a>
  <a class="app" id="writing" href="writing.html"><span class="pic">&#9999;&#65039;</span>Writing</a>
  <a class="app" id="clock" href="clock.html"><span class="pic">&#128339;</span>Clock</a>
  <a class="app" id="reading" href="reading.html"><span class="pic">&#128214;</span>Reading</a>
  <!-- Pronunciation button goes here later -->
<script>
  // Show the version from sw.js (e.g. kids-learning-v7 shows as v7), so it's only set in one place
  fetch("sw.js").then(r => r.text()).then(t => {
    const m = t.match(/kids-learning-(v[0-9.]+)/);
    if (m) document.getElementById("version").textContent = m[1];
  }).catch(() => {});
  // Offline: switch on the service worker (https only)
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
